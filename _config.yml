# Basic site settings
locale: "zh-CN"
title: "张伟 | 山东大学"
title_separator: "-"
name: &name "张伟"
description: &description "山东大学网络空间安全学院（研究院）张伟个人主页。"

# Replace YOUR_GITHUB_USERNAME in the following three fields.
# This configuration assumes that the repository is named:
# YOUR_GITHUB_USERNAME.github.io
url: "https://sduzhangwei.github.io"
baseurl: "/zhangwei2"
repository: "SDUZhangWei/zhangwei2"

# Author information shown in the sidebar
author:
  avatar: "zhangwei.jpg"
  name: "张伟"
  pronouns:
  bio: "山东大学网络空间安全学院（研究院）教授、博士生导师、硕士生导师"
  location: "中国·青岛"
  employer: "山东大学"
  email: "sduzhangwei@sdu.edu.cn"

  # Academic profiles
  arxiv:
  googlescholar: "https://scholar.google.com/citations?user=uJ65n8MAAAAJ&hl=en"
  impactstory:
  orcid:
  semantic:
  pubmed:
  researchgate:
  scopus:

  # # Repositories and software development
  # bitbucket:
  # codepen:
  # dribbble:
  # github: "YOUR_GITHUB_USERNAME"
  # kaggle:
  # stackoverflow:

  # # Social media
  # bluesky:
  # facebook:
  # flickr:
  # foursquare:
  # goodreads:
  # google_plus:
  # keybase:
  # instagram:
  # lastfm:
  # linkedin:
  # mastodon:
  # medium:
  # pinterest:
  # soundcloud:
  # steam:
  # telegram:
  # tumblr:
  # twitter:
  # vine:
  # weibo:
  # wikipedia:
  # xing:
  # youtube:
  # zhihu:

# Publication categories
publication_category:
  manuscripts:
    title: "Journal Articles"
  conferences:
    title: "Conference Papers"

# General site settings
teaser:
breadcrumbs: false
words_per_minute: 160
future: true
read_more: "disabled"
talkmap_link: false

comments:
  provider: false

atom_feed:
  hide: false
  path:

# Search-engine verification codes can be added later.
google_site_verification:
bing_site_verification:
alexa_site_verification:
yandex_site_verification:

# Social sharing metadata
twitter:
  username:
facebook:
  username:
  app_id:
  publisher:
og_image:

social:
  type: "Person"
  name: "张伟"
  links:
    - "https://scholar.google.com/citations?user=uJ65n8MAAAAJ&hl=en"
    - "https://dblp.org/pid/10/4661-173.html"

# Analytics is disabled until a tracking ID is deliberately configured.
analytics:
  provider: false
  google:
    tracking_id:

# Files read by Jekyll
include:
  - .htaccess
  - _pages
  - files

exclude:
  - "*.sublime-project"
  - "*.sublime-workspace"
  - .asset-cache
  - .bundle
  - .github
  - .jekyll-assets-cache
  - .sass-cache
  - assets/js/_main.js
  - assets/js/plugins
  - assets/js/vendor
  - CHANGELOG
  - Capfile
  - config
  - Dockerfile
  - Gemfile
  - Gruntfile.js
  - gulpfile.js
  - LICENSE
  - local
  - log
  - node_modules
  - package.json*
  - Rakefile
  - README
  - tmp
  - vendor

keep_files:
  - .git
  - .svn

encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"

# Markdown processing
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false

kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false

# Template collections
collections:
  teaching:
    output: true
    permalink: /:collection/:path/
  publications:
    output: true
    permalink: /:collection/:path/
  portfolio:
    output: true
    permalink: /:collection/:path/
  talks:
    output: true
    permalink: /:collection/:path/

# Default layouts
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: false
      share: false
      related: true

  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true

  - scope:
      path: ""
      type: teaching
    values:
      layout: single
      author_profile: true
      share: false
      comments: false

  - scope:
      path: ""
      type: publications
    values:
      layout: single
      author_profile: true
      share: false
      comments: false

  - scope:
      path: ""
      type: portfolio
    values:
      layout: single
      author_profile: true
      share: false
      comments: false

  - scope:
      path: ""
      type: talks
    values:
      layout: talk
      author_profile: true
      share: false

# Sass/SCSS
sass:
  sass_dir: _sass
  style: compressed

# Output settings
permalink: /:categories/:title/
timezone: Asia/Shanghai

# GitHub Pages-compatible plugins
plugins:
  - jekyll-feed
  - jekyll-gist
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji

whitelist:
  - jekyll-feed
  - jekyll-gist
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji

# Archive pages
category_archive:
  type: liquid
  path: /categories/

tag_archive:
  type: liquid
  path: /tags/

# HTML compression
compress_html:
  clippings: all
  ignore:
    envs: development
